name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: aligner-bench:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run all aligners
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test_data:/data/test_data:ro" \
            -v "${{ github.workspace }}/comparison:/data/comparison" \
            aligner-bench:test \
            -c "bash /opt/aligner-bench/scripts/run_all_aligners.sh \
                  /data/test_data/reference.fa \
                  /data/test_data/reads.fastq \
                  /data/comparison"

      - name: Show results summary
        run: |
          echo "=== Integration Test Summary ==="
          cat comparison/summary.txt
          echo ""
          echo "=== Files produced ==="
          find comparison -type f | sort

      - name: Commit comparison results
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add comparison/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: update integration test comparison results [skip ci]"
            git push
          fi
